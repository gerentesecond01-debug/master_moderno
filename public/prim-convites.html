<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS • Prim de convites</title><style>body{background:#101827;color:#eef2ff;font:15px system-ui;margin:0;padding:30px}main{max-width:950px;margin:auto}h1{font-size:25px}a{color:#8dbbff}article{background:#1a2639;border:1px solid #32445d;border-radius:14px;padding:20px;margin:15px 0}input,select,button{background:#101827;color:#fff;border:1px solid #58708e;border-radius:7px;padding:11px;margin:6px}button{cursor:pointer;background:#2563eb;border:0}small{color:#cbd5e1}label{display:block;margin-top:10px}code{word-break:break-all}#msg{padding:12px}</style></head><body><main><p><a href="/">← Voltar ao Master</a></p><h1>NEXUS · Prim de convites</h1><p>Coloque o script LSL no prim. Ele aparecerá aqui para aprovação. Configure o bot e o grupo que enviará os convites.</p><button onclick="load()">Atualizar lista</button><p id="msg"></p><section id="list"></section></main><script>
const $=id=>document.getElementById(id);let bots=[];
async function api(path,opts){const r=await fetch(path,{credentials:'same-origin',...opts});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'HTTP '+r.status);return d}
function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
async function load(){try{const [p,b]=await Promise.all([api('/api/prim-invites'),api('/api/bots')]);bots=b.bots||[];$('list').replaceChildren();$('msg').textContent=p.prims.length+' prim(s) cadastrado(s)';for(const prim of p.prims){const card=el('article'),head=el('h3',prim.approved?'Aprovado':'Aguardando aprovação');card.append(head,el('small','Prim: '+prim.prim_id+' · Dono: '+prim.owner_id));const label=el('label','Bot que enviará o convite');const select=el('select');for(const bot of bots){const o=el('option',String(bot.name||bot.avatarName||bot.firstName||'Bot')+' · ID '+bot.id);o.value=bot.id;if(Number(prim.bot_id)===Number(bot.id))o.selected=true;select.append(o)}label.append(select);card.append(label);const groupLabel=el('label','UUID do grupo');const group=el('input');group.placeholder='xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx';group.value=prim.group_id||'';group.size=40;groupLabel.append(group);card.append(groupLabel);const save=el('button','Salvar e aprovar');save.onclick=async()=>{try{await api('/api/prim-invites/'+encodeURIComponent(prim.prim_id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({botId:Number(select.value),groupId:group.value.trim()})});await load()}catch(e){$('msg').textContent=e.message}};const remove=el('button','Revogar');remove.onclick=async()=>{if(!confirm('Revogar este prim?'))return;try{await api('/api/prim-invites/'+encodeURIComponent(prim.prim_id),{method:'DELETE'});await load()}catch(e){$('msg').textContent=e.message}};card.append(save,remove);$('list').append(card)}}catch(e){$('msg').textContent='Erro: '+e.message+' (faça login no Master primeiro)'}}load();
</script></body></html>
